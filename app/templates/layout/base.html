<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}<span data-i18n="tpl.nomadstudio">NomadStudio</span>{% endblock %}</title>
    <meta name="theme-color" id="theme-color-meta" content="#0c121f" />
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/logo/raccoon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}?v={{ asset_v }}" />
    {# Browser storage per profile — must run before any other script touches it. #}
    <script>window.NOMAD_VIEWER = {{ nomad_storage_scope()|tojson }};</script>
    <script src="{{ url_for('static', filename='js/services/storage_scope.js') }}?v={{ asset_v }}"></script>
    <script>
      /* Sets data-theme on <html> synchronously, before the stylesheet's
         default :root values (--accent: #ffffff, an achromatic white) ever
         get painted. Without this, the page briefly renders with the
         default --accent, and since hsl(from var(--accent) h ...) resolves
         an achromatic color's hue to 0deg, every --cs-card-bg-derived color
         (card backgrounds, scrims, etc.) flashes RED for one frame before
         the body-level theme script (further down) applies the saved theme
         and the `background`/`box-shadow` transitions animate away from it.
         CSS below matches both html[data-theme] and body[data-theme], so
         this doesn't require touching the later script or other pages. */
      document.documentElement.setAttribute('data-theme', localStorage.getItem('oj-theme-v1') || '4');
    </script>
    {% block head_prepaint %}{% endblock %}
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fonts/fonts.css') }}?v={{ asset_v }}" />
  </head>
  <body class="{% block body_class %}{% endblock %}">
    <div class="app-shell">
      <main class="main-wrap">
        {% block content %}{% endblock %}
      </main>
    </div>

    <!-- ── Video caption overlay — dev tool for recording tutorials. Click-through
         (pointer-events: none) so it never blocks the real UI underneath; edited
         via the small tab, persisted in localStorage so it survives navigation. ── -->
    <div class="ns-caption-overlay" id="ns-caption-overlay" hidden aria-hidden="true">
      <p class="ns-caption-text" id="ns-caption-text"></p>
    </div>
    <div class="ns-caption-editor" id="ns-caption-editor" hidden>
      <textarea class="ns-caption-editor-input" id="ns-caption-editor-input" rows="2" placeholder="Caption text…" data-i18n-attr="placeholder:tpl.caption_text"></textarea>
      <label class="ns-caption-editor-toggle">
        <input type="checkbox" id="ns-caption-editor-visible">
        <span data-i18n="tpl.show_overlay">Show overlay</span>
      </label>
    </div>
    <button type="button" class="ns-caption-tab cs-icon-btn" id="ns-caption-tab" aria-label="Edit video caption" data-i18n-attr="aria-label:tpl.edit_video_caption">
      <i data-lucide="captions" aria-hidden="true"></i>
      <span class="cs-mode-tip" data-i18n="tpl.edit_video_caption">Edit video caption</span>
    </button>

    <script data-shell-script="1" src="{{ url_for('static', filename='js/state/store.js') }}?v={{ asset_v }}"></script>
    <script data-shell-script="1" src="{{ url_for('static', filename='js/services/api.js') }}?v={{ asset_v }}"></script>
    <script data-shell-script="1" src="{{ url_for('static', filename='js/services/nav_status.js') }}?v={{ asset_v }}"></script>
    <script data-shell-script="1" src="{{ url_for('static', filename='js/services/folder_access.js') }}?v={{ asset_v }}"></script>
    <script data-shell-script="1" src="{{ url_for('static', filename='js/services/session-store.js') }}?v={{ asset_v }}"></script>
    <script data-shell-script="1" src="{{ url_for('static', filename='js/services/depot_indicator.js') }}?v={{ asset_v }}"></script>
    <script data-shell-script="1" src="{{ url_for('static', filename='js/services/video_caption.js') }}?v={{ asset_v }}"></script>
    <script data-shell-script="1" src="{{ url_for('static', filename='js/services/i18n.js') }}?v={{ asset_v }}"></script>
    <script data-shell-script="1" src="{{ url_for('static', filename='js/services/tooltips.js') }}?v={{ asset_v }}"></script>
    <script data-shell-script="1" src="{{ url_for('static', filename='js/services/update_notice.js') }}?v={{ asset_v }}"></script>
    <script data-shell-script="1" src="{{ url_for('static', filename='vendor/lucide/lucide.min.js') }}"></script>
    <script data-shell-script="1">
      lucide.createIcons();
    </script>
    <script data-shell-script="1">
      (function () {
        const THEME_KEY = 'oj-theme-v1';
        const THEMES = [
          { id: '1', icon: '🌕', label: 'Dawn', bg: '#f2f6fd' },
          { id: '2', icon: '🌔', label: 'Dusk', bg: '#161f2f' },
          { id: '3', icon: '🌓', label: 'Twilight', bg: '#0d111f' },
          { id: '4', icon: '🌒', label: 'Night', bg: '#0c121f' },
          { id: '5', icon: '🌑', label: 'Void', bg: '#040a12' },
          { id: '6', icon: '🔴', label: 'Mars', bg: '#140a05' },
          { id: '7', icon: '🟣', label: 'Jupiter', bg: '#0d0620' },
          { id: '8', icon: '🩵', label: 'Saturn', bg: '#030d16' },
        ];

        function applyTheme(id) {
          document.body.setAttribute('data-theme', id);
          const t = THEMES.find((x) => x.id === id) || THEMES[3];
          const iconEl = document.getElementById('theme-cycle-icon');
          const labelEl = document.getElementById('theme-cycle-label');
          const metaEl = document.getElementById('theme-color-meta');
          if (iconEl) iconEl.textContent = t.icon;
          if (labelEl) labelEl.textContent = t.label;
          if (metaEl) metaEl.setAttribute('content', t.bg);
        }

        const saved = localStorage.getItem(THEME_KEY) || '4';
        applyTheme(saved);

        const btn = document.getElementById('theme-cycle-btn');
        if (btn) {
          btn.addEventListener('click', () => {
            const current = document.body.getAttribute('data-theme') || '4';
            const idx = THEMES.findIndex((x) => x.id === current);
            const next = THEMES[(idx + 1) % THEMES.length];
            localStorage.setItem(THEME_KEY, next.id);
            applyTheme(next.id);
          });
        }
      })();
    </script>
    <script data-shell-script="1" src="{{ url_for('static', filename='js/services/page_runtime.js') }}"></script>
    <script data-shell-script="1" src="{{ url_for('static', filename='js/services/shell_router.js') }}"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
